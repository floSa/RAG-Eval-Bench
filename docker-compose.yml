name: ragbench

# =============================================================================
# Banc d'evaluation RAG — stack on-premise.
#
# Inversion par rapport a la version precedente du projet : le service LLM
# CENTRAL (repo llm-service) est desormais le mode par defaut, plus une
# option. Un banc d'evaluation consomme des milliers d'appels par campagne ;
# faire tourner un second Ollama a cote du central saturerait les 16 Go de
# VRAM et fausserait toute mesure de latence.
#
# Prerequis :  make up  dans ~/mes_projets/llm-service  (cree le reseau llm-net)
#
# Lancement :
#   docker compose up -d db                 # base seule (dev local via uv)
#   docker compose up -d                    # base + tableau de bord
#   docker compose run --rm runner ...      # campagne d'evaluation
#
# Ports hote (cf. ~/mes_projets/PORTS.md) : 5432 pgvector, 8502 Streamlit.
# Le port 11435 (ancien Ollama local du projet) est libere.
# =============================================================================

services:
  db:
    image: pgvector/pgvector:pg17
    container_name: ragbench-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-ragbench}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Une campagne ecrit des dizaines de milliers de lignes (predictions,
    # scores) et lit des vecteurs en parcours exact : les valeurs par defaut
    # de Postgres sont trop basses pour ca.
    command: >
      postgres
      -c shared_buffers=512MB
      -c work_mem=64MB
      -c max_parallel_workers_per_gather=4

  # Tableau de bord de comparaison des runs.
  ui:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: ragbench-ui
    restart: unless-stopped
    env_file: [.env]
    environment:
      DB_HOST: db
      LLM_BASE_URL: http://ollama-central:11434/v1
    command: streamlit run src/ragbench/ui/app.py --server.port 8501 --server.address 0.0.0.0 --client.toolbarMode viewer
    ports:
      - "8502:8501"
    networks:
      - app-network
      - llm-net
    depends_on:
      db:
        condition: service_healthy

  # Executeur de campagnes. Pas de `restart` : c'est un job, pas un service.
  #   docker compose run --rm runner ragbench doctor
  runner:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file: [.env]
    environment:
      DB_HOST: db
      LLM_BASE_URL: http://ollama-central:11434/v1
    volumes:
      - ./data:/app/data
      - ./configs:/app/configs
    networks:
      - app-network
      - llm-net
    depends_on:
      db:
        condition: service_healthy
    profiles: ["jobs"]
    entrypoint: ["ragbench"]
    command: ["doctor"]

volumes:
  pgdata:

networks:
  app-network:
  # Cree par `make up` dans llm-service. En "external" pour qu'un seul
  # compose en soit proprietaire.
  llm-net:
    external: true
