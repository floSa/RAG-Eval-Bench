[project]
name = "ragbench"
version = "0.1.0"
description = "Banc d'évaluation RAG on-premise : matrice de configurations x jeux de questions x frameworks d'évaluation"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "openai>=2.0",
    "pydantic>=2.9",
    "pyyaml>=6.0.3",
    "numpy>=2.0",
    "pandas>=2.2",
    "tenacity>=9.0",
    "typer>=0.15",
    "rich>=14.3",
    "httpx>=0.27",
]

# Les frameworks d'evaluation sont des extras : leurs contraintes de version
# entrent souvent en conflit entre elles. Un plugin absent est desactive, pas
# fatal (cf. evaluators/registry.py).
[project.optional-dependencies]
ui = ["streamlit>=1.40", "altair>=5.4"]
# langchain-community<0.4 n'est PAS un caprice : ragas importe au chargement
# `langchain_community.chat_models.vertexai`, retire a partir de la 0.4.
# Sans ce pin, `import ragas` echoue sur du code Google Vertex inutilise ici.
ragas = ["ragas>=0.4,<1.0", "langchain-community<0.4"]
deepeval = ["deepeval>=4.1"]
stats = ["scipy>=1.14", "scikit-learn>=1.5"]

[project.scripts]
ragbench = "ragbench.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragbench"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM", "UP"]
ignore = [
    # typer declare ses options en valeurs par defaut : c'est l'idiome du
    # framework, pas une erreur.
    "B008",
    # Les except larges du projet sont delibérés et commentes un par un :
    # un evaluateur ou un appel LLM qui echoue doit etre TRACE, pas faire
    # tomber une campagne de plusieurs heures.
    "BLE001",
]

[tool.ruff.lint.per-file-ignores]
# Les imports de ces modules servent a peupler un registre : ils sont
# utilises par effet de bord, pas par reference.
"src/ragbench/datasets/__init__.py" = ["F401"]
"src/ragbench/evaluators/__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    # Les tests de non-regression lisent la base et sont ignores si aucune
    # campagne n'a tourne. Les separer permet de lancer la suite unitaire
    # seule : uv run pytest -m "not regression"
    "regression: garde-fous lus depuis la base (necessitent un run evalue)",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
