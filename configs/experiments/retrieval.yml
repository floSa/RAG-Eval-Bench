# Matrice d'experience : quelle strategie de recherche paie ?
#
# AVERTISSEMENT — les runs produits par ce fichier AVANT les correctifs du
# 26/07 sur la recherche lexicale et le reranking sont invalides pour les
# variantes lexical-k5, hybrid-k5 et dense-k5-rerank. Ces trois-la sont
# rejouees par configs/experiments/retrieval-fix.yml. Les cinq autres
# n'utilisent ni l'une ni l'autre et restent valables.
#
# Les variantes sont fusionnees (merge profond) sur `base`, donc chacune ne
# declare que ce qu'elle change. Toutes partagent le meme chunking, donc le
# meme index_hash : le corpus n'est encode qu'UNE fois pour les 6 configs.
#
#   uv run ragbench config matrix configs/experiments/retrieval.yml

base:
  name: retrieval-sweep
  chunking:
    strategy: recursive
    chunk_size: 1000
    chunk_overlap: 150
    header_fields: [title, source, published_at]
    header_scope: chunk
  retrieval:
    mode: dense
    top_k: 5
    fetch_k: 20
    max_per_document: 2
  generation:
    prompt_template: default
    temperature: 0.0
    thinking: false
    # Declare explicitement, meme si c'est la valeur par defaut du code.
    # Ce fichier ne le precisait pas et heritait de 1024, la ou
    # abstention.yml declarait 512 : deux matrices qu'on croyait partager
    # leur reference avaient en realite des hash differents. Le banc l'a
    # signale, mais la lecon vaut d'etre appliquee — une config
    # d'experience declare TOUT ce qu'elle utilise, elle n'herite pas.
    max_tokens: 512
  models:
    generator: gemma4:e4b
    embedder: nomic-embed-text:latest
    judge: gemma4:e4b

variants:
  # --- Temoin sans retrieval -------------------------------------------
  # Le resultat le plus important de la matrice : si le RAG ne bat pas ca,
  # tout le reste est du bruit.
  - name: closed-book
    description: Aucun retrieval, le modele repond de memoire.
    generation:
      prompt_template: closed_book

  # --- Temoin lexical ---------------------------------------------------
  - name: lexical-k5
    description: Recherche plein-texte seule. Dit ce que le dense apporte.
    retrieval:
      mode: lexical

  # --- La baseline ------------------------------------------------------
  - name: dense-k5
    description: Reference.

  # --- Un seul parametre change a la fois -------------------------------
  - name: dense-k10
    description: Deux fois plus de contexte. Teste si le rappel manque ou si le bruit nuit.
    retrieval:
      top_k: 10

  # --- Ablations des deux corrections trouvees au pilote ----------------
  - name: no-doc-cap
    description: >
      Sans plafond par document. Mesure combien de recall le plafond apporte
      sur des questions qui exigent 2 a 4 articles differents.
    retrieval:
      max_per_document: null

  - name: no-header
    description: >
      Chunks sans en-tete contextuel (ni titre, ni source, ni date). Seule
      variante a reindexer le corpus, puisqu'elle change l'index_hash.
      Mesure ce que coute de priver le generateur des metadonnees que les
      questions exigent explicitement.
    chunking:
      header_fields: []

  - name: hybrid-k5
    description: Fusion RRF dense + lexical.
    retrieval:
      mode: hybrid

  - name: dense-k5-rerank
    description: 20 candidats reordonnes par le LLM, 5 gardes. Le plus cher de la matrice.
    retrieval:
      rerank: llm
      fetch_k: 20
